<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña | Andrea Figueroa</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    
    <!-- SweetAlert2 para alertas elegantes -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="login-body">

    <a href="login.html" class="back-to-home" title="Volver al inicio de sesión">
        <i class="fas fa-arrow-left"></i> Volver al login
    </a>

    <div class="login-container">
        <img src="assets/logo.webp" alt="Logo Andrea Figueroa" class="login-logo">
        
        <h2>Restablecer Clave</h2>
        <p class="login-subtitle">Ingresa tu nueva contraseña para actualizar tu acceso.</p>
        
        <form id="resetPasswordForm">
            <div class="input-group">
                <label for="newPassword">Nueva Contraseña</label>
                <input type="password" id="newPassword" placeholder="Mínimo 8 caracteres, números y letras" required>
                <i class="fas fa-eye toggle-password" id="toggleNewPwd"></i>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" placeholder="Repite tu nueva contraseña" required>
                <i class="fas fa-eye toggle-password" id="toggleConfirmPwd"></i>
            </div>

            <div id="resetErrorBox" class="error-box">
                <i class="fas fa-exclamation-circle"></i> <span id="resetErrorText"></span>
            </div>

            <button type="submit" class="cta-btn" id="btnReset">GUARDAR CONTRASEÑA</button>
        </form>
    </div>

    <script src="reset-password.js"></script>
</body>
</html>
